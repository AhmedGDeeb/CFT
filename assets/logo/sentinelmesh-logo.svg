<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150">
  <!-- Background -->
  <rect width="440" height="150" fill="#ffffff"/>

  <!-- ===== MESH NETWORK ===== -->
  <g stroke="#2E9E7E" stroke-width="2">
    <!-- ring edges -->
    <line x1="70" y1="28" x2="112" y2="46"/>
    <line x1="112" y1="46" x2="112" y2="88"/>
    <line x1="112" y1="88" x2="70" y2="106"/>
    <line x1="70" y1="106" x2="28" y2="88"/>
    <line x1="28" y1="88" x2="28" y2="46"/>
    <line x1="28" y1="46" x2="70" y2="28"/>
    <!-- spokes to centre -->
    <line x1="70" y1="28" x2="70" y2="67"/>
    <line x1="112" y1="46" x2="70" y2="67"/>
    <line x1="112" y1="88" x2="70" y2="67"/>
    <line x1="70" y1="106" x2="70" y2="67"/>
    <line x1="28" y1="88" x2="70" y2="67"/>
    <line x1="28" y1="46" x2="70" y2="67"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#0B6E4F">
    <circle cx="70" cy="28" r="4.5"/>
    <circle cx="112" cy="46" r="4.5"/>
    <circle cx="112" cy="88" r="4.5"/>
    <circle cx="70" cy="106" r="4.5"/>
    <circle cx="28" cy="88" r="4.5"/>
    <circle cx="28" cy="46" r="4.5"/>
  </g>

  <!-- Amber alert node (top) -->
  <circle cx="70" cy="28" r="4.5" fill="#E8A33D"/>
  <g fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <path d="M60 24 Q56 16 60 8"/>
    <path d="M80 24 Q84 16 80 8"/>
  </g>

  <!-- ===== RARE TREE AT CENTRE (Cilician fir) ===== -->
  <circle cx="70" cy="67" r="16" fill="#ffffff"/>
  <!-- trunk -->
  <line x1="70" y1="80" x2="70" y2="70" stroke="#6B4A2B" stroke-width="2.2" stroke-linecap="round"/>
  <!-- tiered canopy (fir silhouette) -->
  <g fill="#0B6E4F">
    <path d="M70 50 L78 62 L62 62 Z"/>
    <path d="M70 56 L81 69 L59 69 Z"/>
    <path d="M70 63 L84 78 L56 78 Z"/>
  </g>
  <!-- highlight tier -->
  <path d="M70 50 L74 57 L66 57 Z" fill="#2E9E7E" opacity="0.85"/>

  <!-- ===== WORDMARK ===== -->
  <text x="152" y="70" font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="bold" fill="#0B6E4F">SentinelMesh</text>

  <text x="154" y="92" font-family="'Segoe UI', Tahoma, sans-serif"
        font-size="10.5" fill="#4A4A4A" letter-spacing="1.6">MONITORING WITHOUT INFRASTRUCTURE</text>
</svg>